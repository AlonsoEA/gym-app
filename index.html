<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Gym</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h2.5v10H6zM15.5 7H18v10h-2.5zM8.5 11h7v2h-7z"/></svg>
      <span>Hoy</span>
    </button>
    <button data-tab="calendar">
      <svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zm-2 7v10h14V9zm2 2h3v3H7z"/></svg>
      <span>Calendario</span>
    </button>
    <button data-tab="exercises">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>
      <span>Ejercicios</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.9-1.1L15.8 3h-3.9l-.4 2.7a8 8 0 0 0-1.9 1.1l-2.4-1-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.9 1.1l.4 2.7h3.9l.4-2.7a8 8 0 0 0 1.9-1.1l2.4 1 2-3.4z"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <div class="sheet" id="sheet-body"></div>
  </div>

  <div id="rest" class="rest" hidden>
    <div class="rest-fill" id="rest-fill"></div>
    <div class="rest-info" data-act="rest-tap"><span>Descanso</span><b id="rest-time">1:30</b></div>
    <button data-act="rest-add" data-d="-15">−15</button>
    <button data-act="rest-add" data-d="15">+15</button>
    <button data-act="rest-stop" aria-label="Cerrar temporizador">✕</button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
